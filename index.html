<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Campo Magnetico Rotante Trifase + Correnti</title>
<style>
  body {
    margin: 0;
    background: #0a0e1a;
    color: #e0e6f0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 1.4em; margin: 5px 0 15px; color: #7dd3fc; }
  .container {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  canvas {
    background: #0d1424;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(125,211,252,0.2);
  }
  .controls {
    margin-top: 15px;
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  label { font-size: 0.9em; color: #94a3b8; }
  input[type=range] { width: 180px; }
  button {
    background: #1e40af; color: white; border: none;
    padding: 8px 18px; border-radius: 6px; cursor: pointer;
    font-size: 0.9em;
  }
  button:hover { background: #2563eb; }
  .legend {
    font-size: 0.9em; color: #94a3b8; margin-top: 10px; text-align: center;
    line-height: 1.6em;
  }
  .legend span { font-weight: bold; }
</style>
</head>
<body>
  <h1>🌀 Campo Magnetico Rotante Trifase</h1>

  <div class="container">
    <canvas id="cvVec" width="600" height="600"></canvas>
    <canvas id="cvWave" width="600" height="600"></canvas>
  </div>

  <div class="controls">
    <label>Velocità: <input type="range" id="speed" min="0" max="3" step="0.05" value="1"></label>
    <button id="pause">⏸ Pausa</button>
    <button id="reset">↻ Reset</button>
  </div>
  <div class="legend">
    <span style="color:#ef4444">A — fase A</span> &nbsp;|&nbsp;
    <span style="color:#22c55e">B — fase B</span> &nbsp;|&nbsp;
    <span style="color:#3b82f6">C — fase C</span> &nbsp;|&nbsp;
    <span style="color:#facc15">B<sub>tot</sub> — campo risultante</span>
  </div>

<script>
// ============================================================
// SETUP
// ============================================================
const cvVec  = document.getElementById('cvVec');
const cvWave = document.getElementById('cvWave');
const ctxV   = cvVec.getContext('2d');
const ctxW   = cvWave.getContext('2d');

const WV = cvVec.width,  HV = cvVec.height;
const WW = cvWave.width, HW = cvWave.height;

// Parametri vettoriale
const cxV = WV/2, cyV = HV/2;
const R    = 170;   // raggio avvolgimenti
const Lmax = 110;   // lunghezza max vettore

// Parametri grafico correnti
const padding = { left: 55, right: 30, top: 40, bottom: 40 };
const plotW = WW - padding.left - padding.right;
const plotH = HW - padding.top  - padding.bottom;
const tWindow = 2 * Math.PI * 2;  // mostra 2 periodi completi

let t = 0;
let paused = false;
let speed = 1;
let lastTime = performance.now();

// Angoli degli assi degli avvolgimenti (A in alto, B e C a 120°)
const angA = -Math.PI/2;
const angB = -Math.PI/2 + 2*Math.PI/3;
const angC = -Math.PI/2 + 4*Math.PI/3;

// Colori
const colA = '#ef4444';
const colB = '#22c55e';
const colC = '#3b82f6';
const colR = '#facc15';

// ============================================================
// UTILITY - freccia
// ============================================================
function drawArrow(ctx, x1,y1,x2,y2,color,width=3) {
  const headLen = 12;
  const dx = x2-x1, dy = y2-y1;
  const angle = Math.atan2(dy,dx);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2-Math.cos(angle)*headLen*0.8, y2-Math.sin(angle)*headLen*0.8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-headLen*Math.cos(angle-0.4), y2-headLen*Math.sin(angle-0.4));
  ctx.lineTo(x2-headLen*Math.cos(angle+0.4), y2-headLen*Math.sin(angle+0.4));
  ctx.closePath();
  ctx.fill();
}

// ============================================================
// DISEGNO VETTORIALE (sinistra)
// ============================================================
function drawVectorPanel(t) {
  ctxV.fillStyle = '#0d1424';
  ctxV.fillRect(0,0,WV,HV);

  // cerchio riferimento
  ctxV.beginPath();
  ctxV.arc(cxV, cyV, R, 0, Math.PI*2);
  ctxV.strokeStyle = '#1e293b';
  ctxV.lineWidth = 1;
  ctxV.stroke();

  // correnti
  const ia = Math.cos(t);
  const ib = Math.cos(t - 2*Math.PI/3);
  const ic = Math.cos(t - 4*Math.PI/3);

  // avvolgimenti come "coil" colorati con intensità = |i|
  function drawCoil(angle, current, color) {
    const x = cxV + Math.cos(angle)*R;
    const y = cyV + Math.sin(angle)*R;
    ctxV.save();
    ctxV.translate(x, y);
    ctxV.beginPath();
    ctxV.arc(0, 0, 22, 0, Math.PI*2);
    ctxV.fillStyle = color + '33';
    ctxV.fill();
    ctxV.strokeStyle = color;
    ctxV.lineWidth = 2;
    ctxV.stroke();

    // intensità
    const intens = Math.abs(current);
    ctxV.beginPath();
    ctxV.arc(0, 0, 22, 0, Math.PI*2);
    ctxV.fillStyle = color;
    ctxV.globalAlpha = intens * 0.8;
    ctxV.fill();
    ctxV.globalAlpha = 1;

    // simbolo corrente
    ctxV.fillStyle = '#fff';
    ctxV.font = 'bold 16px sans-serif';
    ctxV.textAlign = 'center';
    ctxV.textBaseline = 'middle';
    ctxV.fillText(current >= 0 ? '×' : '•', 0, 0);
    ctxV.restore();
  }

  drawCoil(angA, ia, colA);
  drawCoil(angB, ib, colB);
  drawCoil(angC, ic, colC);

  // etichette
  ctxV.fillStyle = '#94a3b8';
  ctxV.font = '15px sans-serif';
  ctxV.textAlign = 'center';
  ctxV.textBaseline = 'middle';
  ctxV.fillText('A', cxV + Math.cos(angA)*(R+48), cyV + Math.sin(angA)*(R+48));
  ctxV.fillText('B', cxV + Math.cos(angB)*(R+48), cyV + Math.sin(angB)*(R+48));
  ctxV.fillText('C', cxV + Math.cos(angC)*(R+48), cyV + Math.sin(angC)*(R+48));

  // campi individuali
  const ba = ia * Lmax;
  const bb = ib * Lmax;
  const bc = ic * Lmax;
  drawArrow(ctxV, cxV, cyV, cxV + Math.cos(angA)*ba, cyV + Math.sin(angA)*ba, colA, 3);
  drawArrow(ctxV, cxV, cyV, cxV + Math.cos(angB)*bb, cyV + Math.sin(angB)*bb, colB, 3);
  drawArrow(ctxV, cxV, cyV, cxV + Math.cos(angC)*bc, cyV + Math.sin(angC)*bc, colC, 3);

  // campo risultante
  const bx = Math.cos(angA)*ba + Math.cos(angB)*bb + Math.cos(angC)*bc;
  const by = Math.sin(angA)*ba + Math.sin(angB)*bb + Math.sin(angC)*bc;
  drawArrow(ctxV, cxV, cyV, cxV + bx, cyV + by, colR, 5);

  // cerchio tratteggiato del raggio costante
  const bmag = Math.sqrt(bx*bx + by*by);
  ctxV.beginPath();
  ctxV.setLineDash([6,6]);
  ctxV.arc(cxV, cyV, bmag, 0, Math.PI*2);
  ctxV.strokeStyle = colR + '66';
  ctxV.lineWidth = 1.5;
  ctxV.stroke();
  ctxV.setLineDash([]);

  // info testuali
  ctxV.fillStyle = '#94a3b8';
  ctxV.font = '13px monospace';
  ctxV.textAlign = 'left';
  ctxV.textBaseline = 'top';
  ctxV.fillText(`ωt = ${((t*180/Math.PI) % 360 + 360) % 360 | 0}°`, 15, 15);
  ctxV.fillText(`|B| = ${(bmag/Lmax).toFixed(2)} (cost. = 1.5)`, 15, 33);
}

// ============================================================
// DISEGNO GRAFICO CORRENTI (destra)
// ============================================================
function drawWavePanel(t) {
  ctxW.fillStyle = '#0d1424';
  ctxW.fillRect(0,0,WW,HW);

  // cornice del plot
  const x0 = padding.left;
  const y0 = padding.top;
  const x1 = padding.left + plotW;
  const y1 = padding.top  + plotH;
  const yMid = y0 + plotH/2;

  // griglia orizzontale
  ctxW.strokeStyle = '#1e293b';
  ctxW.lineWidth = 1;
  for (let k = -1; k <= 1; k += 0.5) {
    const y = yMid + k * (plotH/2);
    ctxW.beginPath();
    ctxW.moveTo(x0, y);
    ctxW.lineTo(x1, y);
    ctxW.stroke();
  }
  // griglia verticale ogni 90°
  for (let k = 0; k <= 4; k++) {
    const x = x0 + (k/4) * plotW;
    ctxW.beginPath();
    ctxW.moveTo(x, y0);
    ctxW.lineTo(x, y1);
    ctxW.stroke();
  }
  // assi principali
  ctxW.strokeStyle = '#475569';
  ctxW.lineWidth = 1.5;
  ctxW.beginPath();
  ctxW.moveTo(x0, yMid);
  ctxW.lineTo(x1, yMid);
  ctxW.stroke();
  ctxW.beginPath();
  ctxW.moveTo(x0, y0);
  ctxW.lineTo(x0, y1);
  ctxW.stroke();

  // etichette
  ctxW.fillStyle = '#64748b';
  ctxW.font = '12px sans-serif';
  ctxW.textAlign = 'right';
  ctxW.textBaseline = 'middle';
  ctxW.fillText('+1', x0-8, yMid - plotH/2);
  ctxW.fillText( '0', x0-8, yMid);
  ctxW.fillText('-1', x0-8, yMid + plotH/2);

  ctxW.textAlign = 'center';
  ctxW.textBaseline = 'top';
  ctxW.fillText('0°',   x0,                y1+6);
  ctxW.fillText('180°', x0 + plotW/2,      y1+6);
  ctxW.fillText('360°', x0 + plotW*0.75,   y1+6);
  ctxW.fillText('540°', x0 + plotW,        y1+6);

  ctxW.fillStyle = '#94a3b8';
  ctxW.font = 'bold 13px sans-serif';
  ctxW.textAlign = 'left';
  ctxW.fillText('Correnti di fase', x0, y0 - 25);

  // Funzione: mappa (ωt_rel, i) → (x, y)
  // Mostriamo finestra [t - tWindow, t], con t a destra
  const tStart = t - tWindow;
  const mapX = tau => x0 + ((tau - tStart) / tWindow) * plotW;
  const mapY = i   => yMid - i * (plotH/2);

  // Funzione per disegnare una sinusoide
  function drawSine(phase, color) {
    ctxW.strokeStyle = color;
    ctxW.lineWidth = 2.5;
    ctxW.beginPath();
    const steps = 300;
    for (let k = 0; k <= steps; k++) {
      const tau = tStart + (k/steps) * tWindow;
      const i = Math.cos(tau - phase);
      const x = mapX(tau);
      const y = mapY(i);
      if (k === 0) ctxW.moveTo(x, y);
      else         ctxW.lineTo(x, y);
    }
    ctxW.stroke();
  }

  drawSine(0,                colA);
  drawSine(2*Math.PI/3,      colB);
  drawSine(4*Math.PI/3,      colC);

  // linea verticale mobile (tempo corrente = bordo destro)
  ctxW.strokeStyle = '#facc15';
  ctxW.lineWidth = 2;
  ctxW.setLineDash([5,5]);
  ctxW.beginPath();
  ctxW.moveTo(x1, y0);
  ctxW.lineTo(x1, y1);
  ctxW.stroke();
  ctxW.setLineDash([]);

  // pallini dei valori correnti sul bordo destro
  const vals = [
    { v: Math.cos(t),              c: colA },
    { v: Math.cos(t - 2*Math.PI/3), c: colB },
    { v: Math.cos(t - 4*Math.PI/3), c: colC },
  ];
  vals.forEach(({v, c}) => {
    ctxW.beginPath();
    ctxW.arc(x1, mapY(v), 6, 0, Math.PI*2);
    ctxW.fillStyle = c;
    ctxW.fill();
    ctxW.strokeStyle = '#0d1424';
    ctxW.lineWidth = 2;
    ctxW.stroke();
  });

  // legenda valori numerici
  ctxW.font = '13px monospace';
  ctxW.textAlign = 'left';
  ctxW.textBaseline = 'top';
  ctxW.fillStyle = colA; ctxW.fillText(`i_A = ${vals[0].v.toFixed(2)}`, x1+5, y0);
  ctxW.fillStyle = colB; ctxW.fillText(`i_B = ${vals[1].v.toFixed(2)}`, x1+5, y0+20);
  ctxW.fillStyle = colC; ctxW.fillText(`i_C = ${vals[2].v.toFixed(2)}`, x1+5, y0+40);
  const sum = vals[0].v + vals[1].v + vals[2].v;
  ctxW.fillStyle = '#94a3b8';
  ctxW.fillText(`Σ = ${sum.toFixed(2)}`, x1+5, y0+65);

  // nota: la linea gialla a destra è il "presente"
  ctxW.fillStyle = '#facc15';
  ctxW.font = '11px sans-serif';
  ctxW.textAlign = 'center';
  ctxW.fillText('presente', x1, y1 + 22);
}

// ============================================================
// LOOP PRINCIPALE
// ============================================================
function loop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!paused) t += dt * speed * 2.0;

  drawVectorPanel(t);
  drawWavePanel(t);

  requestAnimationFrame(loop);
}

// ============================================================
// CONTROLLI
// ============================================================
document.getElementById('speed').addEventListener('input', e => {
  speed = parseFloat(e.target.value);
});
document.getElementById('pause').addEventListener('click', e => {
  paused = !paused;
  e.target.textContent = paused ? '▶ Riprendi' : '⏸ Pausa';
});
document.getElementById('reset').addEventListener('click', () => {
  t = 0;
});

requestAnimationFrame(loop);
</script>
</body>
</html>
